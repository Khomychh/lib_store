<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Книжкова крамниця</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ee;
    --surface: #ffffff;
    --ink: #1f1b16;
    --muted: #6d655b;
    --line: #e4ddd1;
    --accent: #7a3e1d;
    --accent-ink: #ffffff;
    --accent-soft: #f3e6dc;
    --danger: #b3261e;
    --ok: #2e6b3a;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f;
      --surface: #211d17;
      --ink: #f1ebe2;
      --muted: #a89e90;
      --line: #3a332a;
      --accent: #d9935f;
      --accent-ink: #1b130c;
      --accent-soft: #3a2a1e;
      --danger: #f08a80;
      --ok: #7fc48d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 Inter, system-ui, sans-serif;
    padding-bottom: 90px;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

  header { padding: 32px 0 16px; }
  h1 { font: 600 30px/1.15 Lora, Georgia, serif; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0; }

  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 12px 0;
    display: flex; gap: 10px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .toolbar input, .toolbar select {
    font: inherit; color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .toolbar input { flex: 1 1 260px; min-width: 0; }
  .count { color: var(--muted); font-size: 13px; padding: 10px 0 4px; }

  .list { list-style: none; margin: 0; padding: 0; }
  .book {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 6px 16px;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .book.in-cart { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); }
  .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .price { font-weight: 600; white-space: nowrap; text-align: right; }
  .price small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }

  .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .qty button {
    width: 36px; height: 36px; border: 0; background: none; color: var(--ink);
    font-size: 18px; cursor: pointer; border-radius: var(--radius);
  }
  .qty button:hover:not(:disabled) { background: var(--accent-soft); }
  .qty button:disabled { opacity: .3; cursor: default; }
  .qty input {
    width: 40px; border: 0; background: none; color: inherit; text-align: center;
    font: inherit; font-weight: 600; -moz-appearance: textfield;
  }
  .qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; }

  @media (max-width: 600px) {
    .book { grid-template-columns: 1fr auto; }
    .book .info { grid-column: 1 / -1; }
    .price { text-align: left; }
  }

  .state { text-align: center; color: var(--muted); padding: 48px 0; }
  .state.error { color: var(--danger); }
  .more { display: block; margin: 16px auto; }

  .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    border: 0; border-radius: var(--radius);
    padding: 11px 18px;
    background: var(--accent); color: var(--accent-ink);
  }
  .btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }

  .cartbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface);
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgba(0,0,0,.06);
    transform: translateY(110%);
    transition: transform .2s ease;
  }
  .cartbar.show { transform: none; }
  .cartbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
  .cartbar b { font-size: 17px; }

  dialog {
    width: min(620px, calc(100% - 24px));
    max-height: calc(100% - 24px);
    border: 0; border-radius: 14px; padding: 0;
    background: var(--surface); color: var(--ink);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 20px; }
  .dlg h2 { font: 600 22px/1.2 Lora, Georgia, serif; margin: 0 0 14px; }
  .lines { list-style: none; margin: 0 0 12px; padding: 0; }
  .lines li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .lines .remove { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; }
  .total { text-align: right; font-size: 17px; margin: 8px 0 18px; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form .full { grid-column: 1 / -1; }
  @media (max-width: 520px) { .form { grid-template-columns: 1fr; } }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  label input, label textarea {
    font: inherit; color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 64px; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .msg { white-space: pre-line; margin-top: 12px; }
  .msg.error { color: var(--danger); }
  .done { text-align: center; padding: 12px 0; }
  .done .big { font: 600 22px Lora, Georgia, serif; color: var(--ok); margin-bottom: 6px; }
</style>
</head>
<body>

<header class="wrap">
  <h1>Книжкова крамниця</h1>
  <p class="sub">Оберіть книги та кількість, потім оформіть замовлення — ми зв'яжемося з вами.</p>
</header>

<div class="toolbar wrap">
  <input id="search" type="search" placeholder="Пошук за назвою або автором…" autocomplete="off">
  <select id="sort" aria-label="Сортування">
    <option value="title">За назвою</option>
    <option value="author">За автором</option>
    <option value="price-asc">Спочатку дешевші</option>
    <option value="price-desc">Спочатку дорожчі</option>
    <option value="year-desc">Спочатку новіші</option>
  </select>
</div>

<main class="wrap">
  <div class="count" id="count"></div>
  <ul class="list" id="list"></ul>
  <div class="state" id="state">Завантаження каталогу…</div>
  <button class="btn ghost more" id="more" hidden>Показати ще</button>
</main>

<div class="cartbar" id="cartbar">
  <div class="wrap">
    <div><span id="cartCount"></span><br><b id="cartTotal"></b></div>
    <button class="btn" id="openOrder">Оформити замовлення</button>
  </div>
</div>

<dialog id="dialog">
  <form class="dlg" id="orderForm" method="dialog">
    <div id="orderBody">
      <h2>Ваше замовлення</h2>
      <ul class="lines" id="lines"></ul>
      <div class="total">Разом: <b id="dlgTotal"></b></div>
      <div class="form">
        <label>ПІБ *<input name="name" required autocomplete="name"></label>
        <label>Телефон *<input name="phone" type="tel" required autocomplete="tel"></label>
        <label class="full">Email<input name="email" type="email" autocomplete="email"></label>
        <label class="full">Доставка (місто, відділення Нової пошти)<input name="delivery"></label>
        <label class="full">Коментар<textarea name="comment"></textarea></label>
      </div>
      <div class="msg error" id="formMsg"></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="closeOrder">Назад</button>
        <button type="submit" class="btn" id="submitOrder">Надіслати замовлення</button>
      </div>
    </div>
    <div id="orderDone" class="done" hidden>
      <div class="big">Дякуємо!</div>
      <p id="doneText"></p>
      <button type="button" class="btn" id="doneClose">Добре</button>
    </div>
  </form>
</dialog>

<script>
// URL веб-застосунку Google Apps Script (див. README.md)
const API_URL = 'https://script.google.com/macros/s/AKfycbzECOv83-3zeRQTkKGr7dDt73XYR64jI6Qv5gPQTOQrSvt9n8VFlsrIMkWJWAIaV6jO/exec';

const PAGE = 60;
const CART_KEY = 'lib_store_cart';

const $ = id => document.getElementById(id);
const money = n => n.toLocaleString('uk-UA') + ' грн';

let books = [];
let byId = new Map();
let filtered = [];
let shown = PAGE;
let cart = loadCart();

function loadCart() {
  try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; } catch { return {}; }
}
function saveCart() {
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch {}
}

async function init() {
  if (!API_URL) {
    $('state').textContent = 'Сайт ще не налаштовано: вкажіть API_URL в index.html.';
    $('state').classList.add('error');
    return;
  }
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    books = data.books;
  } catch (err) {
    $('state').textContent = 'Не вдалося завантажити каталог. Спробуйте оновити сторінку.';
    $('state').classList.add('error');
    console.error(err);
    return;
  }
  byId = new Map(books.map(b => [b.id, b]));
  // прибрати з кошика те, чого вже немає або менше в наявності
  for (const id of Object.keys(cart)) {
    const b = byId.get(id);
    if (!b) delete cart[id];
    else cart[id] = Math.min(cart[id], b.stock);
  }
  saveCart();
  applyFilter();
  updateCartBar();
}

function applyFilter() {
  const q = $('search').value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  filtered = books.filter(b => {
    const hay = (b.title + ' ' + b.author).toLowerCase();
    return words.every(w => hay.includes(w));
  });
  const collator = new Intl.Collator('uk');
  const sorters = {
    'title': (a, b) => collator.compare(a.title, b.title),
    'author': (a, b) => collator.compare(a.author || '￿', b.author || '￿'),
    'price-asc': (a, b) => a.price - b.price,
    'price-desc': (a, b) => b.price - a.price,
    'year-desc': (a, b) => (Number(b.year) || 0) - (Number(a.year) || 0),
  };
  filtered.sort(sorters[$('sort').value]);
  shown = PAGE;
  render();
}

function render() {
  const list = $('list');
  list.textContent = '';
  const frag = document.createDocumentFragment();
  for (const b of filtered.slice(0, shown)) frag.append(bookRow(b));
  list.append(frag);

  $('count').textContent = `Знайдено книг: ${filtered.length}`;
  $('state').textContent = filtered.length ? '' : 'Нічого не знайдено.';
  $('state').classList.remove('error');
  $('more').hidden = shown >= filtered.length;
}

function bookRow(b) {
  const li = document.createElement('li');
  li.className = 'book';
  li.dataset.id = b.id;

  const info = document.createElement('div');
  info.className = 'info';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = b.title;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = [b.author, b.year && b.year + ' р.', b.pages && b.pages + ' с.'].filter(Boolean).join(' · ');
  info.append(title, meta);

  const price = document.createElement('div');
  price.className = 'price';
  price.innerHTML = `${money(b.price)}<small>в наявності: ${b.stock}</small>`;

  li.append(info, price, qtyControl(b, li));
  li.classList.toggle('in-cart', !!cart[b.id]);
  return li;
}

function qtyControl(b, row) {
  const box = document.createElement('div');
  box.className = 'qty';
  const minus = document.createElement('button');
  minus.type = 'button'; minus.textContent = '−'; minus.setAttribute('aria-label', 'Менше');
  const plus = document.createElement('button');
  plus.type = 'button'; plus.textContent = '+'; plus.setAttribute('aria-label', 'Більше');
  const input = document.createElement('input');
  input.type = 'number'; input.min = 0; input.max = b.stock; input.inputMode = 'numeric';
  input.setAttribute('aria-label', 'Кількість');

  const sync = () => {
    const q = cart[b.id] || 0;
    input.value = q;
    minus.disabled = q <= 0;
    plus.disabled = q >= b.stock;
    row.classList.toggle('in-cart', q > 0);
  };
  const set = q => { setQty(b.id, q); sync(); };

  minus.onclick = () => set((cart[b.id] || 0) - 1);
  plus.onclick = () => set((cart[b.id] || 0) + 1);
  input.onchange = () => set(parseInt(input.value, 10) || 0);
  input.onfocus = () => input.select();

  box.append(minus, input, plus);
  sync();
  return box;
}

function setQty(id, q) {
  const b = byId.get(id);
  q = Math.max(0, Math.min(b.stock, q));
  if (q) cart[id] = q; else delete cart[id];
  saveCart();
  updateCartBar();
}

function cartLines() {
  return Object.entries(cart).map(([id, qty]) => ({ book: byId.get(id), qty })).filter(l => l.book);
}
function cartTotal() {
  return cartLines().reduce((s, l) => s + l.book.price * l.qty, 0);
}

function updateCartBar() {
  const lines = cartLines();
  const pcs = lines.reduce((s, l) => s + l.qty, 0);
  $('cartbar').classList.toggle('show', pcs > 0);
  $('cartCount').textContent = `У кошику: ${lines.length} назв, ${pcs} шт.`;
  $('cartTotal').textContent = money(cartTotal());
}

function renderLines() {
  const ul = $('lines');
  ul.textContent = '';
  for (const { book, qty } of cartLines()) {
    const li = document.createElement('li');
    const name = document.createElement('div');
    name.innerHTML = `<div class="title"></div><div class="meta"></div>`;
    name.firstChild.textContent = book.title;
    name.lastChild.textContent = `${book.author ? book.author + ' · ' : ''}${qty} × ${money(book.price)}`;
    const sum = document.createElement('b');
    sum.textContent = money(book.price * qty);
    const rm = document.createElement('button');
    rm.type = 'button'; rm.className = 'remove'; rm.textContent = '×'; rm.title = 'Прибрати';
    rm.onclick = () => {
      setQty(book.id, 0);
      refreshRow(book.id);
      if (!cartLines().length) $('dialog').close();
      else renderLines();
    };
    li.append(name, sum, rm);
    ul.append(li);
  }
  $('dlgTotal').textContent = money(cartTotal());
}

function refreshRow(id) {
  const old = $('list').querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (old) old.replaceWith(bookRow(byId.get(id)));
}

async function submitOrder(e) {
  e.preventDefault();
  const form = $('orderForm');
  if (!form.reportValidity()) return;
  const fd = new FormData(form);
  const payload = {
    customer: Object.fromEntries(['name', 'phone', 'email', 'delivery', 'comment'].map(k => [k, fd.get(k)])),
    items: cartLines().map(l => ({ id: l.book.id, qty: l.qty })),
  };

  const btn = $('submitOrder');
  btn.disabled = true; btn.textContent = 'Надсилаємо…';
  $('formMsg').textContent = '';
  try {
    // text/plain — щоб браузер не робив CORS preflight, який Apps Script не підтримує
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    cart = {};
    saveCart();
    updateCartBar();
    render();
    $('doneText').textContent = `Замовлення № ${data.orderId} на суму ${money(data.total)} прийнято. Ми зв'яжемося з вами найближчим часом.`;
    $('orderBody').hidden = true;
    $('orderDone').hidden = false;
  } catch (err) {
    $('formMsg').textContent = err.message || 'Не вдалося надіслати замовлення. Спробуйте ще раз.';
  } finally {
    btn.disabled = false; btn.textContent = 'Надіслати замовлення';
  }
}

let searchTimer;
$('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(applyFilter, 150); });
$('sort').addEventListener('change', applyFilter);
$('more').addEventListener('click', () => { shown += PAGE; render(); });
$('openOrder').addEventListener('click', () => {
  renderLines();
  $('orderBody').hidden = false;
  $('orderDone').hidden = true;
  $('formMsg').textContent = '';
  $('dialog').showModal();
});
$('closeOrder').addEventListener('click', () => $('dialog').close());
$('doneClose').addEventListener('click', () => $('dialog').close());
$('orderForm').addEventListener('submit', submitOrder);

init();
</script>
</body>
</html>
