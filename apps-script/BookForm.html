<!DOCTYPE html>
<!--
  Форма «Книга» (меню «Каталог» у таблиці замовлень). Серверні функції — у Code.gs: formInit, formGetBook,
  formSaveBook, formAddPhoto. Перевірки тут лише для зручності; остаточні — на сервері (formValidate_).
-->
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font: 13px/1.4 Arial, sans-serif; color: #202124; margin: 0; padding: 12px 16px 16px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .bar .combo { flex: 1; }
  h2 { font-size: 15px; margin: 4px 0 10px; }
  h2 small { font-weight: normal; color: #5f6368; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px; }
  .grid .w2 { grid-column: span 2; }
  .grid .w3 { grid-column: span 3; }
  h3 { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: .04em; color: #5f6368;
       margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #e8eaed; }
  h3:first-of-type { margin-top: 0; }
  h3 small { font-weight: normal; text-transform: none; letter-spacing: 0; }
  .grid .w4 { grid-column: span 4; }
  label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 2px; }
  label b { color: #d93025; font-weight: normal; }
  input, select, textarea { width: 100%; font: inherit; padding: 5px 7px; border: 1px solid #dadce0; border-radius: 4px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 1px #1a73e8; }
  input[readonly] { background: #f1f3f4; color: #5f6368; }
  textarea { min-height: 70px; resize: vertical; }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #202124; margin: 0; cursor: pointer; }
  label.check input { width: auto; margin: 0; }
  label.check small { color: #5f6368; font-size: 11px; }
  .bad { border-color: #d93025 !important; }
  .hint { font-size: 11px; color: #5f6368; min-height: 14px; margin-top: 2px; }
  .hint.err { color: #d93025; }
  .hint.ok { color: #188038; }
  .warn { background: #fef7e0; border: 1px solid #f9d77e; border-radius: 4px; padding: 6px 8px; margin: 8px 0 0; }
  .warn a { color: #1a73e8; cursor: pointer; text-decoration: underline; }

  /* поле з пошуком по списку */
  .combo { position: relative; }
  .combo input { padding-right: 22px; }
  .combo::after { content: '▾'; position: absolute; right: 8px; top: 6px; color: #5f6368; pointer-events: none; font-size: 11px; }
  .dd { position: absolute; z-index: 10; left: 0; right: 0; top: 100%; margin-top: 2px; max-height: 240px; overflow-y: auto;
        background: #fff; border: 1px solid #dadce0; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .dd .opt { padding: 5px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd .opt.on, .dd .opt:hover { background: #e8f0fe; }
  .dd .opt mark { background: none; color: inherit; font-weight: bold; }
  .dd .more { padding: 4px 8px; color: #5f6368; font-size: 11px; }

  .photos { margin-top: 10px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .thumbs img { height: 70px; border-radius: 3px; border: 1px solid #dadce0; cursor: pointer; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  button { font: inherit; padding: 6px 14px; border-radius: 4px; border: 1px solid #dadce0; background: #fff; cursor: pointer; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: bold; }
  button:disabled { opacity: .5; cursor: default; }
  #status { white-space: pre-line; }
  #status.err { color: #d93025; }
  #status.ok { color: #188038; }
  .loading { color: #5f6368; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div id="loading" class="loading">Завантажую каталог…</div>

<div id="app" hidden>
  <div class="bar">
    <input id="search" placeholder="Знайти книгу: №, назва або автор">
    <button id="openBtn">Відкрити</button>
    <button id="newBtn">Нова книга</button>
  </div>

  <h2 id="mode"></h2>

  <form id="form" autocomplete="off">
    <!-- № нової книги ставить сервер; тут він лише для редагування наявної -->
    <input type="hidden" name="id">

    <h3>Книга <small>— переписуєте з книги</small></h3>
    <div class="grid">
      <div class="w3"><label>Назва <b>*</b></label><input name="title"><div class="hint" data-for="title"></div></div>
      <div><label>Автор</label><input name="author"><div class="hint" data-for="author"></div></div>

      <div class="w2"><label>Категорія</label><input name="category" placeholder="— без категорії —"><div class="hint" data-for="category"></div></div>
      <div><label>Мова</label><input name="language"><div class="hint" data-for="language"></div></div>
      <div><label>Палітурка</label><input name="binding"><div class="hint" data-for="binding"></div></div>

      <div class="w2"><label>Видавництво</label><input name="publisher"><div class="hint" data-for="publisher"></div></div>
      <div><label>Рік</label><input name="year" inputmode="numeric"><div class="hint" data-for="year"></div></div>
      <div><label>Сторінки</label><input name="pages" inputmode="numeric"><div class="hint" data-for="pages"></div></div>

      <div class="w2"><label>ISBN</label><input name="isbn"><div class="hint" data-for="isbn"></div></div>
    </div>

    <div id="dupe" class="warn" hidden></div>

    <h3>Примірник і ціна</h3>
    <div class="grid">
      <div><label>Стан</label><select name="condition"></select><div class="hint" data-for="condition"></div></div>
      <div><label>К-сть <b>*</b></label><input name="stock" inputmode="numeric"><div class="hint" data-for="stock"></div></div>
      <div><label>Ціна, грн <b>*</b></label><input name="price" inputmode="decimal"><div class="hint" data-for="price"></div></div>
      <div><label>Акційна ціна</label><input name="salePrice" inputmode="decimal"><div class="hint" data-for="salePrice"></div></div>
    </div>

    <h3>На сайті</h3>
    <div class="grid">
      <div class="w2"><label class="check" title="Дозволено показувати на сайті. Потрібні й інші умови: ціна, наявність чи передзамовлення"><input type="checkbox" name="publish" checked> Публікація</label><div class="hint" data-for="publish"></div></div>
      <div class="w2"><label class="check" title="Книгу можна замовити більше, ніж є, — навіть з К-сть 0"><input type="checkbox" name="preorder"> Передзамовлення <small>(можна замовити більше, ніж є)</small></label></div>

      <div class="w4"><label>Опис <small>(новий рядок — новий абзац)</small></label><textarea name="description"></textarea></div>
    </div>

    <div id="photoBox" class="photos" hidden>
      <label>Фото <span id="photoInfo"></span></label>
      <input id="photoInput" type="file" accept="image/*" multiple>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="actions">
      <button type="submit" class="primary" id="saveBtn">Зберегти</button>
      <span id="status"></span>
    </div>
  </form>
</div>

<script>
const $ = s => document.querySelector(s);
const form = $('#form');
const field = name => form.elements[name];
const FIELDS = ['id', 'title', 'author', 'year', 'pages', 'price', 'salePrice', 'stock',
  'category', 'condition', 'binding', 'language', 'publisher', 'isbn', 'description'];
// після «Додати» ці поля лишаються: зручно вносити пачку книг одного розділу
const STICKY = ['category', 'condition', 'binding', 'language'];

let data = null;      // відповідь formInit
let editing = null;   // № книги, яку редагуємо; null — нова
let dirty = false;
let photos = [];      // [{ base64, url }]
let busy = false;
let preorderWas = ''; // «Передзамовлення» книги в таблиці до змін: порожнє лишається порожнім, якщо галочку не ставили

// Виклик серверної функції як Promise
function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

function setStatus(text, kind) {
  const el = $('#status');
  el.textContent = text || '';
  el.className = kind || '';
}

function bookLabel(b) {
  return `${b[0]} · ${b[1] ? b[1] + ' — ' : ''}${b[2]}`;
}

// ───── Поле з пошуком по списку ─────

// Для пошуку: регістр і різні апострофи не важливі
const norm = s => String(s).toLowerCase().replace(/[’ʼ`‘]/g, "'").replace(/ё/g, 'е');
const MAX_SHOWN = 80;

// input — поле; source() — [{ value, label }]; onPick(option) — що робити з вибраним (типово — вписати value).
// Клік чи фокус показує весь список, введення фільтрує: кожне слово запиту має бути в підписі, у будь-якому місці
function combo(input, source, onPick) {
  const wrap = document.createElement('div');
  wrap.className = 'combo';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  input.autocomplete = 'off';
  const dd = document.createElement('div');
  dd.className = 'dd';
  dd.hidden = true;
  wrap.appendChild(dd);
  let items = [];
  let active = -1;

  function render(query) {
    const words = norm(query.trim()).split(/\s+/).filter(Boolean);
    const all = source();
    const found = words.length ? all.filter(o => { const t = norm(o.label); return words.every(w => t.includes(w)); }) : all;
    // спершу ті, що починаються із запиту
    if (words.length) {
      const q = norm(query.trim());
      found.sort((a, b) => (norm(b.label).startsWith(q) ? 1 : 0) - (norm(a.label).startsWith(q) ? 1 : 0));
    }
    items = found.slice(0, MAX_SHOWN);
    dd.innerHTML = '';
    if (!items.length) { dd.hidden = true; active = -1; return; }
    items.forEach((o, i) => {
      const d = document.createElement('div');
      d.className = 'opt';
      d.title = o.label;
      d.appendChild(highlightWords(o.label, words));
      d.onmousedown = e => { e.preventDefault(); pick(i); };
      dd.appendChild(d);
    });
    if (found.length > MAX_SHOWN) {
      const more = document.createElement('div');
      more.className = 'more';
      more.textContent = `…ще ${found.length - MAX_SHOWN}, уточніть запит`;
      dd.appendChild(more);
    }
    dd.hidden = false;
    setActive(words.length ? 0 : -1);
  }

  function setActive(i) {
    active = i;
    [...dd.querySelectorAll('.opt')].forEach((el, j) => el.classList.toggle('on', j === i));
    if (i >= 0) dd.children[i].scrollIntoView({ block: 'nearest' });
  }

  function pick(i) {
    const o = items[i];
    dd.hidden = true;
    if (onPick) { onPick(o); return; }
    input.value = o.value;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }

  input.addEventListener('focus', () => render(''));
  input.addEventListener('click', () => { if (dd.hidden) render(''); });
  input.addEventListener('input', e => { if (e.isTrusted) render(input.value); });
  input.addEventListener('blur', () => {
    dd.hidden = true;
    // вписали значення, яке відрізняється від наявного лише регістром — беремо наявне
    const v = norm(input.value.trim());
    if (!v || onPick) return;
    const same = source().find(o => norm(o.value) === v);
    if (same && same.value !== input.value) {
      input.value = same.value;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }
  });
  input.addEventListener('keydown', e => {
    const open = !dd.hidden;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!open) render(input.value);
      else setActive(Math.min(active + 1, items.length - 1));
    } else if (e.key === 'ArrowUp') {
      if (open) { e.preventDefault(); setActive(Math.max(active - 1, 0)); }
    } else if (e.key === 'Enter') {
      if (open && active >= 0) { e.preventDefault(); e.stopImmediatePropagation(); pick(active); }
    } else if (e.key === 'Escape') {
      if (open) { e.preventDefault(); dd.hidden = true; }
    } else if (e.key === 'Tab') {
      // Tab по відфільтрованому списку — вибрати підсвічений, як в автодоповненні
      if (open && active >= 0 && input.value.trim()) pick(active);
    }
  });
}

// Підпис з виділеними словами запиту
function highlightWords(label, words) {
  const frag = document.createDocumentFragment();
  if (!words.length) { frag.append(label); return frag; }
  const n = norm(label);
  const marks = new Array(label.length).fill(false);
  words.forEach(w => {
    let i = n.indexOf(w);
    while (i >= 0) { for (let k = i; k < i + w.length; k++) marks[k] = true; i = n.indexOf(w, i + w.length); }
  });
  let i = 0;
  while (i < label.length) {
    let j = i;
    while (j < label.length && marks[j] === marks[i]) j++;
    const part = label.slice(i, j);
    if (marks[i]) { const m = document.createElement('mark'); m.textContent = part; frag.appendChild(m); }
    else frag.append(part);
    i = j;
  }
  return frag;
}

const plain = list => () => list().map(v => ({ value: v, label: v }));

// Категорії зі шляхом: «Біблеїстика › Новий Завіт» — і шукається за будь-якою частиною шляху
function categoryOptions() {
  const byName = {};
  data.categories.forEach(c => { byName[c.name] = c; });
  const path = name => {
    const parts = [];
    const seen = new Set();
    for (let c = byName[name]; c && !seen.has(c.name); c = byName[c.parent]) { seen.add(c.name); parts.unshift(c.name); }
    return parts.join(' › ');
  };
  return data.categories.map(c => ({ value: c.name, label: path(c.name) }));
}

// extra — значення книги поза списком (старий запис): показуємо його, щоб збереження не стерло стан
function fillConditions(extra) {
  const sel = field('condition');
  sel.innerHTML = '<option value="">— (нова) —</option>';
  const list = data.conditions.concat(extra && data.conditions.indexOf(extra) < 0 ? [extra] : []);
  list.forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); });
}

// Підказка під полем, де можна вписати своє значення
const LISTS = { author: 'authors', publisher: 'publishers', binding: 'bindings', language: 'languages' };
function listHint(name) {
  const v = field(name).value.trim();
  const known = !v || data[LISTS[name]].some(x => norm(x) === norm(v));
  const hint = form.querySelector(`.hint[data-for="${name}"]`);
  hint.className = 'hint';
  hint.textContent = known ? ''
    : name === 'binding' || name === 'language' ? 'Нове значення — з’явиться у фільтрі окремим пунктом'
    : name === 'publisher' ? 'Нове видавництво' : 'Новий автор';
}

// ───── Перевірки ─────

// ISBN → 13 цифр або null (як isbn13 у scripts/build.mjs)
function isbn13(raw) {
  const s = String(raw || '').toUpperCase().replace(/[^\dX]/g, '');
  const check13 = d => (10 - [...d].reduce((sum, c, i) => sum + Number(c) * (i % 2 ? 3 : 1), 0) % 10) % 10;
  if (/^\d{13}$/.test(s)) return check13(s.slice(0, 12)) === Number(s[12]) ? s : null;
  if (/^\d{9}[\dX]$/.test(s)) {
    const sum = [...s].reduce((acc, c, i) => acc + (c === 'X' ? 10 : Number(c)) * (10 - i), 0);
    if (sum % 11) return null;
    const d = '978' + s.slice(0, 9);
    return d + check13(d);
  }
  return null;
}

function values() {
  const v = {};
  FIELDS.forEach(k => { v[k] = field(k).value.trim(); });
  // кома в цінах — звична річ, таблиці потрібна крапка
  ['price', 'salePrice'].forEach(k => { v[k] = v[k].replace(',', '.').replace(/\s/g, ''); });
  v.publish = field('publish').checked ? 'true' : 'false';
  // у таблиці — «Доступне» / «Недоступне»; зняли галочку з книги, де щось стояло, — «Недоступне», інакше порожньо
  v.preorder = field('preorder').checked ? 'Доступне' : preorderWas ? 'Недоступне' : '';
  return v;
}

// Повертає { errors, warnings }: { поле: текст }. Попередження зберегти не заважають
function check() {
  const v = values();
  const errors = {};
  const warnings = {};
  const num = s => (s === '' ? null : Number(s));
  if (!v.title) errors.title = 'Обов’язкове поле';
  const price = num(v.price);
  if (!(price > 0)) errors.price = 'Число більше 0';
  const stock = num(v.stock);
  if (stock === null || !Number.isInteger(stock) || stock < 0) errors.stock = 'Ціле число від 0';
  else if (stock === 0) warnings.stock = /^доступн/i.test(v.preorder)
    ? 'Немає в наявності — на сайті лише під передзамовлення'
    : 'З К-сть 0 книга не показується на сайті';
  const sale = num(v.salePrice);
  if (sale !== null) {
    if (!(sale > 0 && sale < price)) errors.salePrice = 'Менша за ціну або порожньо';
    else warnings.salePrice = `Знижка ${Math.round((1 - sale / price) * 100)}%`;
  }
  if (v.year) {
    if (!/^\d+$/.test(v.year)) errors.year = 'Лише цифри';
    else if (Number(v.year) < 1450 || Number(v.year) > new Date().getFullYear() + 1) warnings.year = 'Перевірте рік';
  }
  if (v.pages && !/^\d+$/.test(v.pages)) errors.pages = 'Лише цифри';
  if (v.isbn) {
    if (isbn13(v.isbn)) warnings.isbn = '✓ ISBN правильний';
    else warnings.isbn = 'ISBN з помилкою: перевірте цифри (зберегти можна, але в Google піде без коду)';
  }
  if (v.category && data.categories.length && !data.categories.some(c => c.name === v.category)) {
    errors.category = 'Виберіть категорію зі списку';
  }
  return { errors, warnings };
}

function showCheck() {
  const { errors, warnings } = check();
  ['title', 'price', 'salePrice', 'stock', 'year', 'pages', 'isbn', 'category'].forEach(k => {
    const hint = form.querySelector(`.hint[data-for="${k}"]`);
    const input = field(k);
    const touched = input.dataset.touched || input.value;
    // категорію перевіряємо, коли з поля вийшли — інакше лається на кожну літеру пошуку
    const err = touched && errors[k] && !(k === 'category' && document.activeElement === input);
    input.classList.toggle('bad', Boolean(err));
    if (err) { hint.textContent = errors[k]; hint.className = 'hint err'; }
    else if (warnings[k]) {
      hint.textContent = warnings[k];
      hint.className = 'hint' + (warnings[k].startsWith('✓') ? ' ok' : k === 'isbn' ? ' err' : '');
    } else { hint.textContent = ''; hint.className = 'hint'; }
  });
  const pubHint = form.querySelector('.hint[data-for="publish"]');
  pubHint.textContent = field('publish').checked ? '' : 'Без галочки книги не буде на сайті, і замовити її не вийде';
  pubHint.className = 'hint err';
  showDupes();
  return errors;
}

// Схожа книга вже є в каталозі? Частіше треба збільшити її К-сть, а не додавати другий рядок
function showDupes() {
  const box = $('#dupe');
  const title = norm(field('title').value.trim());
  if (editing || title.length < 3) { box.hidden = true; return; }
  const author = norm(field('author').value.trim());
  const same = data.books.filter(b => norm(b[2]) === title && (!author || !b[1] || norm(b[1]) === author));
  if (!same.length) { box.hidden = true; return; }
  box.innerHTML = '';
  box.append('Така книга вже є: ');
  same.slice(0, 5).forEach((b, i) => {
    if (i) box.append(', ');
    const a = document.createElement('a');
    a.textContent = `№${b[0]}${b[3] !== '' ? ` (К-сть ${b[3]})` : ''}`;
    a.onclick = () => openBook(b[0]);
    box.appendChild(a);
  });
  box.append('. Якщо це той самий примірник — відкрийте її й збільште К-сть.');
  box.hidden = false;
}

// ───── Режими ─────

// № — у заголовку, не полем: нова книга отримує наступний вільний, у наявної він не змінюється
function setMode() {
  const mode = $('#mode');
  mode.textContent = editing ? `Книга №${editing} ` : `Нова книга №${data.nextId} `;
  const small = document.createElement('small');
  small.textContent = editing ? '· № не змінюється: за ним кошик, замовлення й фото' : '· номер ставиться сам';
  mode.appendChild(small);
  $('#saveBtn').textContent = editing ? 'Зберегти зміни' : 'Додати книгу';
}

function clearPhotos() {
  photos = [];
  $('#thumbs').innerHTML = '';
  $('#photoInput').value = '';
}

function resetForm() {
  form.reset();
  FIELDS.forEach(k => { delete field(k).dataset.touched; field(k).classList.remove('bad'); });
  form.querySelectorAll('.hint').forEach(h => { h.textContent = ''; h.className = 'hint'; });
}

function newBook(keepSticky) {
  const keep = {};
  if (keepSticky) STICKY.forEach(k => { keep[k] = field(k).value; });
  resetForm();
  editing = null;
  preorderWas = '';
  fillConditions();
  Object.keys(keep).forEach(k => { field(k).value = keep[k]; });
  field('id').value = data.nextId;
  field('stock').value = 1;
  $('#photoInfo').textContent = '';
  clearPhotos();
  setMode();
  showDupes();
  dirty = false;
  field('title').focus();
}

// Перед тим як відкрити іншу книгу — не втратити незбережене
let confirmLeave = 0;
function canLeave() {
  if (!dirty || Date.now() - confirmLeave < 5000) return true;
  confirmLeave = Date.now();
  setStatus('Є незбережені зміни. Натисніть ще раз, щоб їх скинути.', 'err');
  return false;
}

async function openBook(id) {
  if (busy || !canLeave()) return;
  busy = true;
  setStatus('Відкриваю…');
  try {
    const book = await call('formGetBook', id);
    resetForm();
    editing = book.id;
    fillConditions(book.condition);
    FIELDS.forEach(k => { field(k).value = book[k]; });
    field('publish').checked = book.publish === 'true';
    preorderWas = book.preorder;
    field('preorder').checked = /^доступн/i.test(book.preorder);
    $('#photoInfo').textContent = data.photos ? `(уже є: ${book.photoCount}; нові додадуться після них)` : '';
    clearPhotos();
    setMode();
    showCheck();
    dirty = false;
    $('#search').value = '';
    $('#search').blur();
    setStatus('');
  } catch (err) {
    setStatus(err.message, 'err');
  } finally {
    busy = false;
  }
}

// «Відкрити» чи Enter без вибору зі списку: точний № або єдиний збіг за назвою/автором
function findFromSearch() {
  const q = $('#search').value.trim();
  if (!q) return;
  const id = q.split(' · ')[0].trim().toLowerCase();
  let book = data.books.find(b => b[0].toLowerCase() === id);
  if (!book) {
    const words = norm(q).split(/\s+/);
    const matches = data.books.filter(b => { const t = norm(bookLabel(b)); return words.every(w => t.includes(w)); });
    if (matches.length === 1) book = matches[0];
    else {
      setStatus(matches.length ? `Знайдено ${matches.length} — виберіть зі списку` : 'Нічого не знайдено', 'err');
      return;
    }
  }
  openBook(book[0]);
}

// ───── Фото ─────

// Зменшуємо до 1600 px і JPEG: швидше вантажиться і на сайт, і в Диск
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url);
      resolve({ base64: dataUrl.split(',')[1], url: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`«${file.name}»: формат не підтримується, збережіть як JPG`)); };
    img.src = url;
  });
}

$('#photoInput').addEventListener('change', async e => {
  const files = [...e.target.files];
  e.target.value = '';
  for (const f of files) {
    try {
      const p = await shrink(f);
      photos.push(p);
      const img = document.createElement('img');
      img.src = p.url;
      img.title = 'Натисніть, щоб прибрати';
      img.onclick = () => { photos.splice(photos.indexOf(p), 1); img.remove(); };
      $('#thumbs').appendChild(img);
      dirty = true;
    } catch (err) {
      setStatus(err.message, 'err');
    }
  }
});

// ───── Збереження ─────

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  if (document.activeElement) document.activeElement.blur(); // щоб спрацювало вирівнювання регістру в полях
  FIELDS.forEach(k => { field(k).dataset.touched = '1'; });
  const errors = showCheck();
  if (Object.keys(errors).length) {
    setStatus('Виправте поля, позначені червоним.', 'err');
    return;
  }
  busy = true;
  $('#saveBtn').disabled = true;
  const wasNew = !editing;
  const v = values();
  try {
    setStatus('Зберігаю…');
    const res = await call('formSaveBook', v, wasNew);
    rememberBook(res.id, v);

    let uploaded = 0;
    const failed = [];
    for (const p of photos) {
      setStatus(`Завантажую фото ${uploaded + failed.length + 1} з ${photos.length}…`);
      try { await call('formAddPhoto', res.id, p.base64); uploaded++; }
      catch (err) { failed.push(err.message); }
    }

    const msg = `${wasNew ? 'Додано' : 'Збережено'} №${res.id} (рядок ${res.row})` +
      (uploaded ? `, фото: ${uploaded}` : '') + (failed.length ? `\nФото не завантажились: ${failed.join('; ')}` : '');
    dirty = false;
    if (wasNew) {
      newBook(true);
    } else {
      clearPhotos();
      const count = await call('formGetBook', res.id).then(b => b.photoCount).catch(() => null);
      if (count !== null && data.photos) $('#photoInfo').textContent = `(уже є: ${count}; нові додадуться після них)`;
    }
    setStatus(msg, failed.length ? 'err' : 'ok');
  } catch (err) {
    setStatus(err.message, 'err');
  } finally {
    busy = false;
    $('#saveBtn').disabled = false;
  }
});

// Оновлюємо локальні списки, щоб пошук, дублі й наступний № були актуальні без перезавантаження
function rememberBook(id, v) {
  const row = [String(id), v.author, v.title, v.stock];
  const i = data.books.findIndex(b => b[0].toLowerCase() === String(id).toLowerCase());
  if (i >= 0) data.books[i] = row; else data.books.push(row);
  if (/^\d+$/.test(String(id))) data.nextId = Math.max(data.nextId, Number(id) + 1);
  Object.keys(LISTS).forEach(k => {
    const list = data[LISTS[k]];
    if (v[k] && !list.some(x => norm(x) === norm(v[k]))) list.push(v[k]);
  });
}

// ───── Старт ─────

form.addEventListener('input', e => {
  dirty = true;
  if (e.target.name) e.target.dataset.touched = '1';
  showCheck();
});
form.addEventListener('focusout', e => { if (e.target.name === 'category') showCheck(); });
Object.keys(LISTS).forEach(k => field(k).addEventListener('change', () => { listHint(k); showDupes(); }));

$('#openBtn').onclick = findFromSearch;
$('#newBtn').onclick = () => { if (!busy && canLeave()) { newBook(false); setStatus(''); } };

call('formInit').then(d => {
  data = d;
  combo(field('author'), plain(() => data.authors));
  combo(field('publisher'), plain(() => data.publishers));
  combo(field('binding'), plain(() => data.bindings));
  combo(field('language'), plain(() => data.languages));
  if (data.categories.length) combo(field('category'), categoryOptions);
  // пошук книги: вибір зі списку одразу відкриває її
  combo($('#search'), () => data.books.map(b => ({ value: b[0], label: bookLabel(b) })), o => openBook(o.value));
  $('#search').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); findFromSearch(); } });

  $('#photoBox').hidden = !data.photos;
  $('#loading').hidden = true;
  $('#app').hidden = false;
  newBook(false);
}).catch(err => {
  $('#loading').textContent = 'Не вдалося завантажити каталог: ' + err.message;
});
</script>
</body>
</html>
