# Збирає сайт (scripts/build.mjs) і публікує його в GitHub Pages.
# Запускається після кожного пушу в main, щогодини (щоб сторінки книг встигали за таблицею)
# і вручну: Actions → «Сайт» → Run workflow.
# Один раз у репозиторії: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Сайт

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# нова публікація чекає на попередню, а не скасовує її
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # якщо каталог не відповідає, збирання падає і на сайті лишається попередня версія
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
